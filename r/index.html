<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食序</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F2E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13140E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../assets/icon/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon/apple-touch-icon.png">
<script>try{var t=localStorage.getItem("mise.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<script>
// Before the first paint: the page's language from the browser, and Safari's Smart App Banner. Safari reads the
// banner's tag as the page loads, so it's written here, with this dish's link as app-argument: once Shiso is installed
// from the banner, the banner's Open hands the link to the app, which adds the dish.
(function () {
  document.documentElement.lang = /^zh/i.test(navigator.language || '') ? 'zh-Hans' : 'en';
  var key = new URLSearchParams(location.search).get('k');
  var page = location.origin + location.pathname.replace(/index\.html$/, '');
  var meta = document.createElement('meta');
  meta.name = 'apple-itunes-app';
  meta.content = 'app-id=6788616705, app-argument=' + page + (/^[0-9A-Za-z]{16}$/.test(key || '') ? '?k=' + key : '');
  document.head.appendChild(meta);
})();
</script>
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<div class="site shared" id="page">

<header class="shared-col shared-top">
  <a class="shared-brand" id="brand" href="../zh/">食序</a>
  <span class="shared-slogan" id="slogan">陪你记录的个性化食谱书</span>
</header>

<main class="shared-col shared-main">
  <div class="shared-state">
    <img class="app-icon icon-l" src="../assets/icon/icon-256.png" alt="" width="88" height="88"><img class="app-icon icon-d" src="../assets/icon/icon-dark-256.png" alt="" width="88" height="88">
    <h1 id="title">记在食序里的一道菜</h1>
  </div>
</main>

<footer class="shared-foot">
  <div class="shared-col shared-foot-in">
    <a class="btn pri" id="get" href="https://apps.apple.com/app/id6788616705">在 App Store 下载食序</a>
    <p class="shared-hint" id="hint" hidden>装好后点顶上的「打开」，这道菜就会导入</p>
  </div>
</footer>

</div>

<div class="wechat" id="wechat" role="note" hidden>
  <svg viewBox="0 0 120 110" aria-hidden="true"><path d="M14 104C40 96 84 70 100 14"/><path d="M86 22l14-10 4 17"/></svg>
  <p><span id="wechat-1">点右上角 ···</span><br><span id="wechat-2">选「在浏览器打开」</span></p>
</div>

<script>
// 食序 Shiso: the page a dish card's QR code opens where the app isn't installed. It only offers the app: the dish
// itself isn't read here (that would need a CloudKit API token in the page), and comes into the app once it's
// installed, through Safari's banner, or by scanning the code again.
(function () {
  'use strict';

  var COPY = {
    zh: {
      brand: '食序', home: '../zh/', slogan: '陪你记录的个性化食谱书', page: '食序', title: '记在食序里的一道菜',
      get: '在 App Store 下载食序', hint: '装好后点顶上的「打开」，这道菜就会导入',
      wechat: ['点右上角 ···', '选「在浏览器打开」']
    },
    en: {
      brand: 'Shiso', home: '../', slogan: 'Cooking that grows with you', page: 'Shiso', title: 'A dish kept in Shiso',
      get: 'Download Shiso on the App Store', hint: 'Once it’s installed, tap Open at the top to add this dish',
      wechat: ['Tap ··· at the top right', 'then choose Open in Browser']
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  var agent = navigator.userAgent;
  // ?wechat=1 shows WeChat's layer anywhere, for review.
  var inWeChat = /MicroMessenger/i.test(agent) || new URLSearchParams(location.search).get('wechat') === '1';
  // Only iOS Safari shows the Smart App Banner, so only there does the line about its Open make sense.
  var inSafari = /iP(hone|od|ad)/.test(agent) && /Safari\//.test(agent) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA|MicroMessenger/.test(agent);
  var lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  var copy = COPY[lang];

  $('page').classList.toggle('zh', lang === 'zh');
  $('brand').textContent = copy.brand;
  $('brand').setAttribute('href', copy.home);
  $('slogan').textContent = copy.slogan;
  $('title').textContent = copy.title;
  $('get').textContent = copy.get;
  $('hint').textContent = copy.hint;
  $('hint').hidden = !(inSafari && !inWeChat);
  $('wechat-1').textContent = copy.wechat[0];
  $('wechat-2').textContent = copy.wechat[1];
  document.title = copy.page;

  // WeChat opens links in its own browser, where neither the banner nor the app's link works. A tap puts the layer away.
  if (inWeChat) {
    $('wechat').hidden = false;
    $('wechat').addEventListener('click', function () { $('wechat').hidden = true; });
  }
})();
</script>
<script src="../assets/site.js"></script>
</body>
</html>
